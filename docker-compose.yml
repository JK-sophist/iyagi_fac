version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: iyagi-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: iyagi-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    container_name: iyagi-backend
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: infra/worker.Dockerfile
    container_name: iyagi-worker
    env_file: .env
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    container_name: iyagi-frontend
    env_file: .env
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
